# Production deploys from main: check → deploy → smoke test.
# The deploy step is skipped (with a notice) until the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist; see README.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; production deploy skipped. See README.md."
          fi
      - name: Verify Cloudflare API token
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip accidental whitespace from pasted secrets; never print the values.
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "token length after trim: ${#token}"
          echo "account id length after trim: ${#account} (expected 32)"
          verify="$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token")"
          echo "verify: $(printf '%s' "$verify" | jq -c '{success, status: .result.status, errors}')"
          if ! printf '%s' "$verify" | jq -e '.success and .result.status == "active"' >/dev/null; then
            echo "::error::CLOUDFLARE_API_TOKEN is not a valid, active Cloudflare API token (see verify output above)."
            exit 1
          fi
          # Which accounts the token can see (ids only) helps spot a token scoped to the wrong account.
          echo "accounts visible to token: $(curl -s 'https://api.cloudflare.com/client/v4/accounts?per_page=20' -H "Authorization: Bearer $token" | jq -c '[.result[]?.id] // .errors')"
          echo "expected account: $account"
          scripts="$(curl -s "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts?per_page=1" -H "Authorization: Bearer $token")"
          echo "workers scripts access: $(printf '%s' "$scripts" | jq -c '{success, errors}')"
          if ! printf '%s' "$scripts" | jq -e '.success' >/dev/null; then
            echo "::error::The token cannot read Workers scripts for this account. Check the token's Account Resources and the Workers Scripts:Edit permission."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Deploy to production
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --env production --var "BUILD_SHA:${GITHUB_SHA::7}"
      - name: Smoke test production
        if: steps.creds.outputs.ready == 'true'
        run: |
          # The new version can take a few seconds to reach every edge; retry before calling it a failure.
          for attempt in 1 2 3 4 5 6; do
            if node scripts/smoke.mjs https://reply.mashbean.net --expect-sha "${GITHUB_SHA::7}"; then exit 0; fi
            echo "smoke attempt ${attempt} did not see the new build yet; retrying in 10s"
            sleep 10
          done
          exit 1
